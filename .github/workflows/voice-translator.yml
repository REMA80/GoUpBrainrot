name: Voice-Übersetzer Windows-App bauen

on:
  push:
    paths:
      - "voice-translator/**"
      - ".github/workflows/voice-translator.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voice-translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Prüfen, ob alles importierbar ist
        run: python -c "import translator, gui, soundcard, deepl, openai"

      - name: .exe bauen
        # --collect-all soundcard: soundcard liest zur Laufzeit mitgelieferte .h-Dateien.
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name VoiceTranslator
          --add-data "phone.html;."
          --collect-all soundcard
          gui.py

      - name: Anleitung beilegen
        run: Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator-Windows
          path: voice-translator/dist/
