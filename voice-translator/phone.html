<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice-Übersetzer</title>
<style>
  :root { --bg: #111; --fg: #f2f2f2; --dim: #9a9a9a; --card: #1e1e1e; --accent: #4fc3f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: system-ui, sans-serif; }
  header { position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
           padding: 10px 16px; background: #000; }
  header h1 { flex: 1; margin: 0; font-size: 16px; }
  #status { font-size: 12px; color: var(--dim); }
  button { background: var(--card); color: var(--fg); border: 1px solid #444;
           border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 12px 16px; }
  .item { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .item.new { outline: 2px solid var(--accent); }
  .tr { font-size: 22px; line-height: 1.3; }
  .orig { margin-top: 6px; font-size: 14px; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<header>
  <h1>Voice-Übersetzer</h1>
  <span id="status">verbinde…</span>
  <button id="speak">Vorlesen: aus</button>
</header>
<main id="list"><p class="empty">Warte auf die erste Übersetzung…</p></main>
<script>
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const speakBtn = document.getElementById("speak");
  let last = 0, speakOn = false, first = true;

  speakBtn.onclick = () => {
    speakOn = !speakOn;
    speakBtn.textContent = "Vorlesen: " + (speakOn ? "an" : "aus");
    speakBtn.classList.toggle("on", speakOn);
    // Browser erlauben Sprachausgabe erst nach einem Tipp: hier "freischalten".
    if (speakOn && window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    e.textContent = text;
    return e;
  }

  function show(item) {
    if (first) { list.innerHTML = ""; first = false; }
    document.querySelectorAll(".item.new").forEach(e => e.classList.remove("new"));
    const card = el("div", "item new", "");
    card.appendChild(el("div", "tr", item.translated || item.original));
    const info = item.time + " · " + item.source + (item.translated ? ": " + item.original : "");
    card.appendChild(el("div", "orig", info));
    list.prepend(card);
    while (list.children.length > 50) list.lastChild.remove();

    if (speakOn && item.translated && window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(item.translated);
      u.lang = item.target.toLowerCase();
      speechSynthesis.speak(u);
    }
  }

  async function poll() {
    try {
      const r = await fetch("/api?after=" + last, { cache: "no-store" });
      const items = await r.json();
      for (const it of items) { show(it); last = it.id; }
      status.textContent = "verbunden";
    } catch (e) {
      status.textContent = "keine Verbindung zum PC";
    }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
